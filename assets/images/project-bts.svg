<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b0f"/>
      <stop offset="50%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2738" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#00ff66" opacity="0.3"/>
    </pattern>
    <filter id="neonGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" fill="url(#grid3)" opacity="0.65"/>

  <!-- Circuit Trace Accents -->
  <path d="M 0 80 L 150 80 L 190 120 L 280 120" fill="none" stroke="#00ff66" stroke-width="1.5" opacity="0.4"/>
  <circle cx="280" cy="120" r="3" fill="#00ff66" opacity="0.7"/>
  <path d="M 800 370 L 670 370 L 630 330 L 500 330" fill="none" stroke="#00ff66" stroke-width="1.5" opacity="0.4"/>
  <circle cx="500" cy="330" r="3" fill="#00ff66" opacity="0.7"/>

  <!-- Outer Frame -->
  <rect x="25" y="25" width="750" height="400" rx="6" fill="none" stroke="#223046" stroke-width="1.5"/>
  <rect x="23" y="23" width="12" height="12" fill="none" stroke="#00ff66" stroke-width="2"/>
  <rect x="765" y="23" width="12" height="12" fill="none" stroke="#00ff66" stroke-width="2"/>
  <rect x="23" y="415" width="12" height="12" fill="none" stroke="#00ff66" stroke-width="2"/>
  <rect x="765" y="415" width="12" height="12" fill="none" stroke="#00ff66" stroke-width="2"/>

  <!-- Header HUD Tag -->
  <rect x="40" y="40" width="180" height="24" rx="3" fill="#131c28" stroke="#00ff66" stroke-width="1"/>
  <circle cx="54" cy="52" r="4" fill="#00ff66" filter="url(#neonGlow3)"/>
  <text x="68" y="56" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYS DESIGN // PRJ-03</text>

  <rect x="580" y="40" width="180" height="24" rx="3" fill="#131c28" stroke="#27384e" stroke-width="1"/>
  <text x="670" y="56" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">ICAT JAM 2024 // ANDROID</text>

  <!-- Central Visual: 2-Lane Risk/Reward Highway Schematic -->
  <g transform="translate(100, 85)">
    <!-- Main Highway Roadbed -->
    <rect x="0" y="20" width="360" height="190" rx="6" fill="#0f1622" stroke="#273a50" stroke-width="1.5"/>

    <!-- Lane 1 (Safe Left Lane) -->
    <rect x="10" y="30" width="165" height="170" rx="4" fill="#141e2c" stroke="#1e2c3e" stroke-width="1"/>
    <text x="92" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SAFE LANE (LEFT)</text>
    <text x="92" y="65" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Steady Speed // Dense Traffic</text>
    <!-- Player vehicle vector -->
    <rect x="72" y="130" width="40" height="55" rx="4" fill="#19283a" stroke="#00ff66" stroke-width="1.5" filter="url(#neonGlow3)"/>
    <polygon points="92,138 85,150 99,150" fill="#00ff66"/>
    <text x="92" y="170" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">PLAYER</text>

    <!-- Lane Divider (Dashed) -->
    <line x1="180" y1="30" x2="180" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10,8"/>

    <!-- Lane 2 (Oncoming Hazard / Shortcut Lane) -->
    <rect x="185" y="30" width="165" height="170" rx="4" fill="#1c1619" stroke="#3d2429" stroke-width="1"/>
    <text x="267" y="50" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">RISK LANE (ONCOMING)</text>
    <text x="267" y="65" fill="#991b1b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">High Risk // High Speed Shortcut</text>
    <!-- Oncoming traffic vector -->
    <rect x="247" y="70" width="40" height="50" rx="4" fill="#2d1519" stroke="#ef4444" stroke-width="1.2"/>
    <polygon points="267,110 260,98 274,98" fill="#ef4444"/>
    <text x="267" y="85" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">NPC FLEET</text>

    <!-- Lane Swap Inversion Vector Arrow -->
    <path d="M 115 150 Q 180 140 240 100" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="245,96 236,102 242,108" fill="#00ff66"/>

    <!-- Right Side HUD Telemetry & Mechanics Breakdown -->
    <g transform="translate(380, 20)">
      <!-- System Rule 1: Dynamic Control Inversion -->
      <rect x="0" y="0" width="220" height="55" rx="4" fill="#101722" stroke="#283a52" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#00ff66"/>
      <text x="30" y="21" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="12">CONTROL INVERSION</text>
      <text x="30" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Theme "Reverse" Mechanic</text>
      <text x="30" y="48" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="8">L ⇄ R Dynamic Swap</text>

      <!-- System Rule 2: Escalating Difficulty Curves -->
      <rect x="0" y="68" width="220" height="55" rx="4" fill="#101722" stroke="#283a52" stroke-width="1.2"/>
      <circle cx="18" cy="86" r="4" fill="#38bdf8"/>
      <text x="30" y="89" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="12">DIFFICULTY SCALING</text>
      <text x="30" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Level 1: Density 0.35 / Norm</text>
      <text x="30" y="116" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">Level 3: Chaos Velocity x2.2</text>

      <!-- System Rule 3: Traffic Light State Machine -->
      <rect x="0" y="136" width="220" height="55" rx="4" fill="#101722" stroke="#283a52" stroke-width="1.2"/>
      <circle cx="18" cy="154" r="4" fill="#fbbf24"/>
      <text x="30" y="157" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="12">SIGNAL STATE MACHINE</text>
      <text x="30" y="174" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Green: Flush // Red: Stagnation</text>
      <text x="30" y="184" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8">High-Risk Overtake Windows</text>
    </g>
  </g>

  <!-- Big Title & Concept Watermark -->
  <text x="45" y="380" fill="#ffffff" font-family="'Rajdhani', 'Orbitron', sans-serif" font-weight="800" font-size="32" letter-spacing="2">BTS: BENGALURU TRAFFIC SIMULATOR</text>
  <text x="45" y="405" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">ARCADE DRIVING &amp; SYSTEM BALANCING // ANDROID APK ALPHA</text>

  <!-- Technical Spec Footer Pill -->
  <rect x="520" y="375" width="240" height="34" rx="4" fill="#101722" stroke="#213044" stroke-width="1"/>
  <text x="535" y="396" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">THEME:</text>
  <text x="585" y="396" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">REVERSE (CHAOTIC HIGHWAY)</text>
</svg>
