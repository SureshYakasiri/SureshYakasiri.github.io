<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tourneyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <filter id="tourneyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="360" rx="8" fill="url(#tourneyBg)" stroke="#1f2d3e" stroke-width="1.5"/>

  <!-- Tactical Header -->
  <rect x="25" y="20" width="650" height="40" rx="4" fill="#0d141e" stroke="#00ff66" stroke-width="1"/>
  <circle cx="45" cy="40" r="5" fill="#00ff66" filter="url(#tourneyGlow)"/>
  <text x="60" y="44" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">VALORANT TOURNAMENT OPS // ICAT GAMERS 2025</text>
  <rect x="520" y="26" width="145" height="28" rx="3" fill="#172230"/>
  <text x="592" y="44" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">40+ PLAYERS</text>

  <!-- Bracket Visual -->
  <!-- Column 1: Quarterfinals / Group Stage (Left) -->
  <g transform="translate(30, 85)">
    <!-- Match 1 -->
    <rect x="0" y="0" width="140" height="28" rx="3" fill="#121a25" stroke="#253549" stroke-width="1"/>
    <text x="12" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">TEAM ALPHA</text>
    <text x="125" y="18" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">13</text>

    <rect x="0" y="32" width="140" height="28" rx="3" fill="#0e141c" stroke="#1d2938" stroke-width="1"/>
    <text x="12" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">TEAM BRAVO</text>
    <text x="125" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">7</text>

    <!-- Connector lines -->
    <path d="M 140 30 L 165 30 L 165 80 L 190 80" fill="none" stroke="#00ff66" stroke-width="1.5" opacity="0.7"/>

    <!-- Match 2 -->
    <rect x="0" y="100" width="140" height="28" rx="3" fill="#121a25" stroke="#253549" stroke-width="1"/>
    <text x="12" y="118" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">TEAM CHARLIE</text>
    <text x="125" y="118" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">13</text>

    <rect x="0" y="132" width="140" height="28" rx="3" fill="#0e141c" stroke="#1d2938" stroke-width="1"/>
    <text x="12" y="150" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">TEAM DELTA</text>
    <text x="125" y="150" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">11</text>

    <path d="M 140 130 L 165 130 L 165 80" fill="none" stroke="#253549" stroke-width="1.5"/>
  </g>

  <!-- Column 2: Semifinals -->
  <g transform="translate(220, 130)">
    <rect x="0" y="0" width="140" height="32" rx="3" fill="#141f2d" stroke="#00ff66" stroke-width="1.2"/>
    <text x="12" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TEAM ALPHA</text>
    <text x="125" y="20" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">13</text>

    <rect x="0" y="38" width="140" height="32" rx="3" fill="#0e141c" stroke="#1f2d3e" stroke-width="1"/>
    <text x="12" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">TEAM CHARLIE</text>
    <text x="125" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">9</text>

    <!-- Connector to Finals -->
    <path d="M 140 35 L 180 35 L 180 85 L 210 85" fill="none" stroke="#00ff66" stroke-width="2" filter="url(#tourneyGlow)"/>
  </g>

  <!-- Column 3: Grand Finals & Champion Trophy (Right) -->
  <g transform="translate(430, 95)">
    <!-- Champion Presentation Box -->
    <rect x="0" y="0" width="235" height="185" rx="6" fill="#111a26" stroke="#00ff66" stroke-width="1.8" filter="url(#tourneyGlow)"/>
    
    <!-- Trophy Icon Art -->
    <g transform="translate(95, 18)">
      <!-- Golden / Neon Glow Trophy Cup -->
      <polygon points="12,0 32,0 38,20 28,34 16,34 6,20" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
      <!-- Handles -->
      <path d="M 8 6 C -2 6 -2 18 8 20" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <path d="M 36 6 C 46 6 46 18 36 20" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <!-- Stem and Base -->
      <rect x="19" y="34" width="6" height="12" fill="#d97706"/>
      <polygon points="12,46 32,46 36,54 8,54" fill="#b45309" stroke="#fbbf24" stroke-width="1"/>
      <circle cx="22" cy="16" r="4" fill="#ffffff" opacity="0.6"/>
    </g>

    <text x="117" y="94" fill="#fbbf24" font-family="'Rajdhani', sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1">1ST PLACE CHAMPION</text>
    <text x="117" y="112" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">TROPHY RECOGNITION</text>

    <line x1="25" y1="125" x2="210" y2="125" stroke="#23354a" stroke-width="1"/>

    <text x="117" y="145" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ROLE: TOURNAMENT MANAGER</text>
    <text x="117" y="162" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">BRACKETS • RULES • TECH OPS</text>
  </g>

  <!-- Ops Telemetry Bar Footer -->
  <rect x="25" y="300" width="650" height="38" rx="4" fill="#0d141e" stroke="#1d2a3c" stroke-width="1"/>
  <text x="45" y="324" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="10">STATUS:</text>
  <text x="100" y="324" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">40+ PLAYERS COORDINATED</text>
  <text x="290" y="324" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">//</text>
  <text x="315" y="324" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="10">RULES:</text>
  <text x="365" y="324" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">COMPETITIVE STANDARD</text>
  <text x="525" y="324" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">//</text>
  <text x="545" y="324" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">VICTORY: 1ST PLACE</text>
</svg>
